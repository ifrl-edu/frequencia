<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Sistema de Frequência</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Poppins:wght@300;400;500&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --verde: #008542;
      --verde-escuro: #006633;
      --vermelho: #C62828;
      --fundo: #f4f6f9;
      --branco: #ffffff;
      --preto: #222;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--fundo);
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      margin-top: 40px;
      color: var(--preto);
      letter-spacing: 2px;
    }

    .top-logo {
      position: absolute;
      top: 20px;
      right: 40px;
    }

    .top-logo img {
      height: 60px;
    }

    .card {
      background: var(--branco);
      width: 480px;
      padding: 50px 40px;
      border-radius: 20px;
      margin-top: 60px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border-radius: 30px;
      border: 1px solid #ddd;
      margin: 15px 0;
      font-size: 14px;
      outline: none;
    }

    button {
      margin-top: 20px;
      padding: 12px 40px;
      border: none;
      border-radius: 30px;
      background: var(--verde);
      color: white;
      font-weight: 500;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: var(--verde-escuro);
      transform: scale(1.05);
    }

    .btn-vermelho {
      background: var(--vermelho);
    }

    .hidden {
      display: none;
    }

    .section {
      width: 900px;
      margin-top: 40px;
      background: var(--branco);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
    }

    .aluno {
      padding: 15px;
      border-bottom: 1px solid #eee;
    }

    h3 {
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <div class="top-logo">
    <img src="https://www.ifal.edu.br/sites/default/files/logo-ifal.png" alt="IFAL">
  </div>

  <h1>SISTEMA DE FREQUÊNCIA</h1>

  <!-- ✅ LOGIN ÚNICO (mantém seu design) -->
  <div class="card" id="loginDiv">
    <h3>LOGIN</h3>
    <input type="email" id="usuario" placeholder="Email" autocomplete="username" required>
    <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" required>
    <button onclick="login()">Entrar</button>
    <p id="erro" style="color:red;margin-top:10px;"></p>
  </div>

  <!-- ✅ SISTEMA (só aparece quando logar) -->
  <div id="mainScreen" style="display:none; width:100%; display:flex; flex-direction:column; align-items:center;">

    <!-- MENU -->
    <div class="card" id="menuDiv" style="display:none;">
      <h3>Painel Administrativo</h3>

      <button onclick="mostrarTela('chamada')">Fazer Chamada</button>
      <button onclick="mostrarTela('historico')">Consultar Histórico</button>
      <button onclick="mostrarTela('cadastro')">Cadastrar Aluno</button>

      <button onclick="mostrarTela('dados')">Consultar Dados do Aluno</button>
      <button onclick="mostrarTela('gerenciar')">Gerenciar Alunos</button>

      <button class="btn-vermelho" onclick="logout()">Sair</button>
    </div>

    <!-- ÁREA DINÂMICA -->
    <div class="section hidden" id="area"></div>

  </div>

  <!-- ✅ SCRIPT DO SISTEMA (SEM login/logout aqui) -->
  <script>
    // Dados locais (ainda localStorage). Depois a gente migra pra Firestore.
    if (!localStorage.getItem("alunos")) localStorage.setItem("alunos", JSON.stringify([]));

    // TROCAR TELAS
    function mostrarTela(tipo) {
      area.innerHTML = "";
      area.classList.remove("hidden");

      if (tipo === "cadastro") {
        area.innerHTML = `
          <h3>Cadastrar Aluno</h3>
          <input id="nome" placeholder="Nome completo">
          <input id="matricula" placeholder="Matrícula">
          <input id="cpf" placeholder="CPF">
          <button onclick="addAluno()">Cadastrar</button>
        `;
      }

      if (tipo === "chamada") carregarChamada();
      if (tipo === "historico") carregarHistorico();

      if (tipo === "dados") {
        let alunos = JSON.parse(localStorage.getItem("alunos"));
        area.innerHTML = `
          <h3>Consultar Dados do Aluno</h3>
          <select id="selectDados"></select>
          <button onclick="mostrarDadosAluno()">Consultar</button>
          <div id="resultadoDados"></div>
        `;
        alunos.forEach((aluno, i) => {
          selectDados.innerHTML += `<option value="${i}">${aluno.nome}</option>`;
        });
      }

      if (tipo === "gerenciar") carregarGerenciamento();
    }

    // CADASTRAR ALUNO
    function addAluno() {
      let alunos = JSON.parse(localStorage.getItem("alunos"));
      alunos.push({
        nome: nome.value,
        matricula: matricula.value,
        cpf: cpf.value,
        historico: []
      });
      localStorage.setItem("alunos", JSON.stringify(alunos));
      alert("Aluno cadastrado!");
    }

    // CHAMADA
    function carregarChamada() {
      let alunos = JSON.parse(localStorage.getItem("alunos"));

      area.innerHTML = `
        <h3>Nova Chamada</h3>
        <input type="date" id="dataChamada">
        <div id="lista"></div>
        <button onclick="salvarChamada()">Salvar Chamada</button>
      `;

      dataChamada.value = new Date().toISOString().split("T")[0];

      alunos.forEach((aluno, i) => {
        lista.innerHTML += `
          <div class="aluno">
            <strong>${aluno.nome}</strong> - ${aluno.matricula}
            <select id="status_${i}">
              <option>Presente</option>
              <option>Falta</option>
              <option>Justificada</option>
            </select>
            <input id="obs_${i}" placeholder="Observação">
          </div>
        `;
      });
    }

    function salvarChamada() {
      let alunos = JSON.parse(localStorage.getItem("alunos"));
      let data = dataChamada.value;

      alunos.forEach((aluno, i) => {
        aluno.historico.push({
          data,
          status: document.getElementById("status_" + i).value,
          obs: document.getElementById("obs_" + i).value
        });

        // reset visual após salvar (se você quiser)
        document.getElementById("status_" + i).value = "Presente";
        document.getElementById("obs_" + i).value = "";
      });

      localStorage.setItem("alunos", JSON.stringify(alunos));
      alert("Chamada salva!");
    }

    // HISTÓRICO POR DATA
    function carregarHistorico() {
      let alunos = JSON.parse(localStorage.getItem("alunos"));

      area.innerHTML = `
        <h3>Consultar Histórico</h3>
        <select id="selectAluno"></select>

        <input type="date" id="dataInicio" placeholder="Data inicial">
        <input type="date" id="dataFim" placeholder="Data final">

        <button onclick="mostrarHistorico()">Consultar</button>
        <div id="resultado"></div>
      `;

      alunos.forEach((aluno, i) => {
        selectAluno.innerHTML += `<option value="${i}">${aluno.nome}</option>`;
      });
    }

    function mostrarHistorico() {
      let alunos = JSON.parse(localStorage.getItem("alunos"));
      let aluno = alunos[selectAluno.value];
      let inicio = dataInicio.value;
      let fim = dataFim.value;

      resultado.innerHTML = `<h3>${aluno.nome}</h3>`;

      let filtrado = aluno.historico.filter(reg =>
        (!inicio || reg.data >= inicio) &&
        (!fim || reg.data <= fim)
      );

      if (filtrado.length === 0) {
        resultado.innerHTML += "<p>Sem registros nesse período.</p>";
        return;
      }

      filtrado.forEach(reg => {
        resultado.innerHTML += `
          <div class="aluno">
            <strong>${reg.data}</strong><br>
            Status: ${reg.status}<br>
            Obs: ${reg.obs || "Nenhuma"}
          </div>
        `;
      });
    }

    // CONSULTAR DADOS DO ALUNO
    function mostrarDadosAluno() {
      let alunos = JSON.parse(localStorage.getItem("alunos"));
      let aluno = alunos[selectDados.value];

      resultadoDados.innerHTML = `
        <div class="aluno">
          <strong>Nome:</strong> ${aluno.nome}<br>
          <strong>Matrícula:</strong> ${aluno.matricula}<br>
          <strong>CPF:</strong> ${aluno.cpf}
        </div>
      `;
    }

    // GERENCIAR / EXCLUIR ALUNOS
    function carregarGerenciamento() {
      let alunos = JSON.parse(localStorage.getItem("alunos"));

      area.innerHTML = `
        <h3>Gerenciar Alunos</h3>
        <div id="listaAlunosGerenciar"></div>
      `;

      if (alunos.length === 0) {
        listaAlunosGerenciar.innerHTML = "<p>Nenhum aluno cadastrado.</p>";
        return;
      }

      alunos.forEach((aluno, i) => {
        listaAlunosGerenciar.innerHTML += `
          <div class="aluno">
            <strong>${aluno.nome}</strong><br>
            Matrícula: ${aluno.matricula}<br>
            CPF: ${aluno.cpf}<br>
            <button class="btn-vermelho" onclick="excluirAluno(${i})">Excluir</button>
          </div>
        `;
      });
    }

    function excluirAluno(index) {
      let alunos = JSON.parse(localStorage.getItem("alunos"));

      if (confirm("Tem certeza que deseja excluir este aluno?")) {
        alunos.splice(index, 1);
        localStorage.setItem("alunos", JSON.stringify(alunos));
        carregarGerenciamento();
      }
    }
  </script>

  <!-- ✅ FIREBASE (MODULAR) - ÚNICO LUGAR QUE CONTROLA login/logout -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

    // (Firestore fica pra próxima etapa — agora estamos só estabilizando login)
    // import { getFirestore } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBCQ749PmF1P293ohEMsm7B-5UiN17uSRk",
      authDomain: "frequencia-b4d4c.firebaseapp.com",
      projectId: "frequencia-b4d4c",
      storageBucket: "frequencia-b4d4c.firebasestorage.app",
      messagingSenderId: "591825878051",
      appId: "1:591825878051:web:f1536e8ff6a4d34d5e8596",
      measurementId: "G-H7S5DC322Y"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // login() chamado pelo botão
    window.login = function () {
      const email = document.getElementById("usuario").value;
      const senha = document.getElementById("senha").value;

      signInWithEmailAndPassword(auth, email, senha)
        .then(() => {
          document.getElementById("erro").innerText = "";
          // Quem mostra/oculta é o onAuthStateChanged abaixo
        })
        .catch((error) => {
          document.getElementById("erro").innerText = "Erro: " + error.message;
        });
    };

    // logout() chamado pelo menu
    window.logout = function () {
      signOut(auth);
    };

    // controle de tela
    onAuthStateChanged(auth, (user) => {
      const loginDiv = document.getElementById("loginDiv");
      const mainScreen = document.getElementById("mainScreen");
      const menuDiv = document.getElementById("menuDiv");
      const area = document.getElementById("area");

      if (user) {
        loginDiv.style.display = "none";
        mainScreen.style.display = "flex";
        menuDiv.style.display = "block";
        if (area) area.classList.add("hidden");
      } else {
        loginDiv.style.display = "block";
        mainScreen.style.display = "none";
        if (menuDiv) menuDiv.style.display = "none";
      }
    });
  </script>

</body>

</html>

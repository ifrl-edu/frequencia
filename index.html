<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta charset="UTF-8" />
  <title>Sistema de Frequência</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --verde: #008542;
      --verde-escuro: #006633;
      --vermelho: #C62828;
      --fundo: #f4f6f9;
      --branco: #ffffff;
      --preto: #222;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--fundo);
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      margin-top: 40px;
      color: var(--preto);
      letter-spacing: 2px;
    }

    .top-logo { position: absolute; top: 20px; right: 40px; }
    .top-logo img { height: 60px; }

    .card {
      background: var(--branco);
      width: 90%;
      max-width: 480px;
      padding: 50px 40px;
      border-radius: 20px;
      margin-top: 60px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 30px;
      border: 1px solid #ddd;
      margin: 15px 0;
      font-size: 14px;
      outline: none;
    }

    button {
      margin-top: 20px;
      padding: 12px 40px;
      border: none;
      border-radius: 30px;
      background: var(--verde);
      color: white;
      font-weight: 500;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover { background: var(--verde-escuro); transform: scale(1.05); }
    .btn-vermelho { background: var(--vermelho); }
    .hidden { display: none; }

    .section {
      width: 95%;
      max-width: 900px;
      margin-top: 40px;
      background: var(--branco);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
    }

    .aluno { padding: 15px; border-bottom: 1px solid #eee; }
    h3 { margin-bottom: 20px; }

    .pill {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: #f1f1f1;
      font-size: 12px;
      margin-top: 10px;
      word-break: break-word;
    }

    .row {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .row > * { flex: 1; min-width: 180px; }

    @media (max-width: 768px) {
      h1 { font-size: 28px; text-align: center; }
      .card { padding: 30px 20px; }
      .section { padding: 25px; }
      button { width: 100%; }
      .top-logo img { height: 45px; }
      .row > * { min-width: 100%; }
    }
  </style>
</head>

<body>
  <div class="top-logo">
    <img src="https://www.ifal.edu.br/sites/default/files/logo-ifal.png" alt="IFAL" />
  </div>

  <h1>SISTEMA DE FREQUÊNCIA</h1>

  <!-- LOGIN -->
  <div class="card" id="loginDiv">
    <h3>LOGIN</h3>
    <input type="email" id="usuario" placeholder="Email" autocomplete="username" required />
    <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" required />
    <button onclick="login()">Entrar</button>
    <p id="erro" style="color:red;margin-top:10px;"></p>
  </div>

  <!-- SISTEMA -->
  <div id="mainScreen" style="display:none; width:100%; display:flex; flex-direction:column; align-items:center;">
    <div class="card" id="menuDiv" style="display:none;">
      <h3 id="tituloPainel">Painel</h3>
      <div class="pill" id="badgeRole" style="display:none;"></div>

      <!-- Menu Admin -->
      <div id="menuAdmin" class="hidden">
        <button onclick="mostrarTela('chamada')">Fazer Chamada</button>
        <button onclick="mostrarTela('historico')">Consultar Histórico</button>
        <button onclick="mostrarTela('cadastro')">Cadastrar Aluno</button>
        <button onclick="mostrarTela('dados')">Consultar Dados do Aluno</button>
        <button onclick="mostrarTela('gerenciar')">Gerenciar Alunos</button>
      </div>

      <!-- Menu Aluno -->
      <div id="menuAluno" class="hidden">
        <button onclick="mostrarTela('minhaSituacao')">Minha Situação</button>
      </div>

      <button class="btn-vermelho" onclick="logout()">Sair</button>
    </div>

    <div class="section hidden" id="area"></div>
  </div>

  <!-- FIREBASE (AUTH + FIRESTORE) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      getDoc,
      doc,
      deleteDoc,
      query,
      where,
      orderBy,
      serverTimestamp,
      limit
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    // ====== SUA CONFIG (cole aqui a do Firebase Console se mudar) ======
    const firebaseConfig = {
      apiKey: "AIzaSyBCQ749PmF1P293ohEMsm7B-5UiN17uSRk",
      authDomain: "frequencia-b4d4c.firebaseapp.com",
      projectId: "frequencia-b4d4c",
      storageBucket: "frequencia-b4d4c.firebasestorage.app",
      messagingSenderId: "591825878051",
      appId: "1:591825878051:web:f1536e8ff6a4d34d5e8596"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ====== ESTADO ======
    let ALUNOS = [];
    let CURRENT_ROLE = "aluno"; // 'admin' | 'aluno'
    let CURRENT_USER_EMAIL = "";

    async function isAdminUID(uid) {
      const ref = doc(db, "admins", uid);
      const snap = await getDoc(ref);
      return snap.exists();
    }

    async function carregarAlunos() {
      const snap = await getDocs(collection(db, "alunos"));
      ALUNOS = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (a.nome || "").localeCompare(b.nome || ""));
      return ALUNOS;
    }

    function hojeISO() {
      return new Date().toISOString().split("T")[0];
    }

    function limparEmail(s) {
      return String(s || "").trim().toLowerCase();
    }

    function renderBarraFrequencia(pct) {
      const p = Math.max(0, Math.min(100, Math.round(pct || 0)));
      return `
        <strong>Frequência:</strong> ${p}%<br>
        <div style="background:#eee; border-radius:999px; overflow:hidden; height:14px; margin-top:8px;">
          <div style="width:${p}%; height:14px; background: var(--verde);"></div>
        </div>
      `;
    }

    // ====== AUTH ======
    window.login = function () {
      const email = limparEmail(document.getElementById("usuario").value);
      const senha = document.getElementById("senha").value;

      signInWithEmailAndPassword(auth, email, senha)
        .then(() => {
          document.getElementById("erro").innerText = "";
        })
        .catch((error) => {
          document.getElementById("erro").innerText = "Erro: " + error.message;
        });
    };

    window.logout = function () {
      signOut(auth);
    };

    onAuthStateChanged(auth, async (user) => {
      const loginDiv = document.getElementById("loginDiv");
      const mainScreen = document.getElementById("mainScreen");
      const menuDiv = document.getElementById("menuDiv");
      const area = document.getElementById("area");

      const menuAdmin = document.getElementById("menuAdmin");
      const menuAluno = document.getElementById("menuAluno");
      const badgeRole = document.getElementById("badgeRole");
      const tituloPainel = document.getElementById("tituloPainel");

      if (!user) {
        CURRENT_USER_EMAIL = "";
        CURRENT_ROLE = "aluno";
        loginDiv.style.display = "block";
        mainScreen.style.display = "none";
        menuDiv.style.display = "none";
        if (area) area.classList.add("hidden");
        return;
      }

      CURRENT_USER_EMAIL = user.email || "";
      const admin = await isAdminUID(user.uid);
      CURRENT_ROLE = admin ? "admin" : "aluno";

      loginDiv.style.display = "none";
      mainScreen.style.display = "flex";
      menuDiv.style.display = "block";
      if (area) area.classList.add("hidden");

      badgeRole.style.display = "inline-block";
      badgeRole.innerText = admin ? `ADMIN • ${CURRENT_USER_EMAIL}` : `ALUNO • ${CURRENT_USER_EMAIL}`;
      tituloPainel.innerText = admin ? "Painel Administrativo" : "Painel do Aluno";

      menuAdmin.classList.toggle("hidden", !admin);
      menuAluno.classList.toggle("hidden", admin);

      if (!admin) {
        await window.mostrarTela("minhaSituacao");
      }
    });

    // ====== TELAS ======
    window.mostrarTela = async function (tipo) {
      const area = document.getElementById("area");
      area.innerHTML = "";
      area.classList.remove("hidden");

      // ---------- ALUNO ----------
      if (tipo === "minhaSituacao") {
        const q = query(collection(db, "alunos"), where("email", "==", limparEmail(CURRENT_USER_EMAIL)), limit(1));
        const snap = await getDocs(q);

        if (snap.empty) {
          area.innerHTML = `
            <h3>Minha Situação</h3>
            <p>Seu email (<strong>${CURRENT_USER_EMAIL}</strong>) ainda não está vinculado a nenhum aluno no sistema.</p>
            <p>Peça ao coordenador para cadastrar seu aluno com este mesmo email.</p>
          `;
          return;
        }

        const docAluno = snap.docs[0];
        const a = { id: docAluno.id, ...docAluno.data() };

        const histSnap = await getDocs(collection(db, "alunos", a.id, "historico"));

        let total = 0, presentes = 0, faltas = 0, justificadas = 0;
        histSnap.forEach(d => {
          const reg = d.data();
          if (!reg || !reg.status) return;
          total++;
          const s = String(reg.status).toLowerCase();
          if (s.includes("presente")) presentes++;
          else if (s.includes("falta")) faltas++;
          else if (s.includes("just")) justificadas++;
        });

        // Regra: Justificada conta como presença
        const freq = total > 0 ? ((presentes + justificadas) / total) * 100 : 0;

        area.innerHTML = `
          <h3>Minha Situação</h3>
          <div class="aluno">
            <strong>Nome:</strong> ${a.nome || "-"}<br>
            <strong>Matrícula:</strong> ${a.matricula || "-"}<br>
            <strong>Turma:</strong> ${a.turma || "-"}<br><br>

            ${renderBarraFrequencia(freq)}

            <div style="margin-top:12px; line-height:1.6;">
              <strong>Total:</strong> ${total}<br>
              <strong>Presenças:</strong> ${presentes}<br>
              <strong>Justificadas:</strong> ${justificadas}<br>
              <strong>Faltas:</strong> ${faltas}
            </div>
          </div>
        `;
        return;
      }

      // ---------- ADMIN ----------
      if (CURRENT_ROLE !== "admin") {
        area.innerHTML = "<p>Acesso negado.</p>";
        return;
      }

      if (tipo === "cadastro") {
        area.innerHTML = `
          <h3>Cadastrar Aluno</h3>
          <input id="nome" placeholder="Nome completo">
          <input id="matricula" placeholder="Matrícula">
          <input id="cpf" placeholder="CPF">
          <input id="emailAluno" placeholder="Email do aluno (login)" type="email">
          <select id="turma">
            <option value="Manhã">Manhã</option>
            <option value="Tarde">Tarde</option>
          </select>

          <button onclick="addAluno()">Cadastrar</button>

          <p style="margin-top:14px; font-size:12px; color:#555; line-height:1.4;">
            Dica: para o aluno entrar, crie também o usuário dele em <strong>Authentication</strong> com esse mesmo email.
          </p>
        `;
        return;
      }

      if (tipo === "chamada") {
        await carregarAlunos();
        area.innerHTML = `
          <h3>Nova Chamada</h3>

          <div class="row">
            <input type="date" id="dataChamada">
            <select id="filtroTurma">
              <option value="Todas">Todas as turmas</option>
              <option value="Manhã">Manhã</option>
              <option value="Tarde">Tarde</option>
            </select>
          </div>

          <div id="lista"></div>
          <button onclick="salvarChamada()">Salvar Chamada</button>
        `;

        document.getElementById("dataChamada").value = hojeISO();
        document.getElementById("filtroTurma").addEventListener("change", renderListaChamada);
        renderListaChamada();
        return;
      }

      if (tipo === "historico") {
        await carregarAlunos();
        area.innerHTML = `
          <h3>Consultar Histórico</h3>

          <select id="selectAluno"></select>

          <div class="row">
            <input type="date" id="dataInicio" placeholder="Data inicial">
            <input type="date" id="dataFim" placeholder="Data final">
          </div>

          <button onclick="mostrarHistorico()">Consultar</button>
          <div id="resultado"></div>
        `;

        const select = document.getElementById("selectAluno");
        const resultado = document.getElementById("resultado");

        if (ALUNOS.length === 0) {
          resultado.innerHTML = "<p>Nenhum aluno cadastrado.</p>";
          return;
        }

        ALUNOS.forEach((a, idx) => {
          select.innerHTML += `<option value="${idx}">${a.nome} (${a.turma || "-"})</option>`;
        });
        return;
      }

      if (tipo === "dados") {
        await carregarAlunos();
        area.innerHTML = `
          <h3>Consultar Dados do Aluno</h3>
          <select id="selectDados"></select>
          <button onclick="mostrarDadosAluno()">Consultar</button>
          <div id="resultadoDados"></div>
        `;

        const select = document.getElementById("selectDados");
        const box = document.getElementById("resultadoDados");

        if (ALUNOS.length === 0) {
          box.innerHTML = "<p>Nenhum aluno cadastrado.</p>";
          return;
        }

        ALUNOS.forEach((a, idx) => {
          select.innerHTML += `<option value="${idx}">${a.nome} (${a.turma || "-"})</option>`;
        });
        return;
      }

      if (tipo === "gerenciar") {
        await carregarAlunos();
        area.innerHTML = `
          <h3>Gerenciar Alunos</h3>
          <div id="listaAlunosGerenciar"></div>
        `;

        const box = document.getElementById("listaAlunosGerenciar");
        if (ALUNOS.length === 0) {
          box.innerHTML = "<p>Nenhum aluno cadastrado.</p>";
          return;
        }

        ALUNOS.forEach((a) => {
          box.innerHTML += `
            <div class="aluno">
              <strong>${a.nome}</strong><br>
              Matrícula: ${a.matricula || "-"}<br>
              CPF: ${a.cpf || "-"}<br>
              Email: ${a.email || "-"}<br>
              Turma: ${a.turma || "-"}<br>
              <button class="btn-vermelho" onclick="excluirAluno('${a.id}')">Excluir</button>
            </div>
          `;
        });
        return;
      }

      area.innerHTML = "<p>Tela não encontrada.</p>";
    };

    // ====== Chamada (render + salvar) ======
    function renderListaChamada() {
      const lista = document.getElementById("lista");
      const filtro = document.getElementById("filtroTurma").value;

      let filtrados = ALUNOS;
      if (filtro !== "Todas") filtrados = ALUNOS.filter(a => a.turma === filtro);

      if (filtrados.length === 0) {
        lista.innerHTML = "<p>Nenhum aluno nessa turma.</p>";
        return;
      }

      lista.innerHTML = "";
      filtrados.forEach((aluno) => {
        lista.innerHTML += `
          <div class="aluno">
            <strong>${aluno.nome}</strong> - ${aluno.matricula || "-"} • ${aluno.turma || "-"}
            <select id="status_${aluno.id}">
              <option>Presente</option>
              <option>Falta</option>
              <option>Justificada</option>
            </select>
            <input id="obs_${aluno.id}" placeholder="Observação">
          </div>
        `;
      });
    }

    // ====== AÇÕES (ADMIN) ======
    window.addAluno = async function () {
      const nome = document.getElementById("nome").value.trim();
      const matricula = document.getElementById("matricula").value.trim();
      const cpf = document.getElementById("cpf").value.trim();
      const email = limparEmail(document.getElementById("emailAluno").value);
      const turma = document.getElementById("turma").value;

      if (!nome || !matricula || !cpf || !email || !turma) {
        alert("Preencha Nome, Matrícula, CPF, Email e Turma.");
        return;
      }

      // (Opcional) evita emails duplicados
      const qEmail = query(collection(db, "alunos"), where("email", "==", email), limit(1));
      const existing = await getDocs(qEmail);
      if (!existing.empty) {
        alert("Já existe um aluno cadastrado com esse email.");
        return;
      }

      await addDoc(collection(db, "alunos"), {
        nome, matricula, cpf, email, turma,
        criadoEm: serverTimestamp()
      });

      alert("Aluno cadastrado (online)!");
      await carregarAlunos();
    };

    window.salvarChamada = async function () {
      const data = document.getElementById("dataChamada").value;
      if (!data) { alert("Escolha a data."); return; }

      if (ALUNOS.length === 0) await carregarAlunos();
      const filtro = document.getElementById("filtroTurma").value;
      const listaParaSalvar = (filtro === "Todas") ? ALUNOS : ALUNOS.filter(a => a.turma === filtro);

      if (listaParaSalvar.length === 0) { alert("Nenhum aluno para salvar."); return; }

      for (const aluno of listaParaSalvar) {
        const status = document.getElementById("status_" + aluno.id).value;
        const obs = document.getElementById("obs_" + aluno.id).value.trim();

        await addDoc(collection(db, "alunos", aluno.id, "historico"), {
          data, status, obs,
          criadoEm: serverTimestamp()
        });

        document.getElementById("status_" + aluno.id).value = "Presente";
        document.getElementById("obs_" + aluno.id).value = "";
      }

      alert("Chamada salva (online)!");
    };

    window.mostrarHistorico = async function () {
      const idx = Number(document.getElementById("selectAluno").value);
      const aluno = ALUNOS[idx];
      const inicio = document.getElementById("dataInicio").value;
      const fim = document.getElementById("dataFim").value;
      const resultado = document.getElementById("resultado");

      resultado.innerHTML = `<h3>${aluno.nome}</h3>`;

      const col = collection(db, "alunos", aluno.id, "historico");
      const filtros = [];
      if (inicio) filtros.push(where("data", ">=", inicio));
      if (fim) filtros.push(where("data", "<=", fim));

      const q = query(col, ...filtros, orderBy("data", "desc"));
      const snap = await getDocs(q);

      if (snap.empty) {
        resultado.innerHTML += "<p>Sem registros nesse período.</p>";
        return;
      }

      snap.forEach((d) => {
        const reg = d.data();
        resultado.innerHTML += `
          <div class="aluno">
            <strong>${reg.data}</strong><br>
            Status: ${reg.status}<br>
            Obs: ${reg.obs || "Nenhuma"}
          </div>
        `;
      });
    };

    // Dados do aluno + % (Justificada conta como presença)
    window.mostrarDadosAluno = async function () {
      const idx = Number(document.getElementById("selectDados").value);
      const a = ALUNOS[idx];

      const box = document.getElementById("resultadoDados");
      box.innerHTML = `<p>Carregando dados e frequência...</p>`;

      const histSnap = await getDocs(collection(db, "alunos", a.id, "historico"));

      let total = 0, presentes = 0, faltas = 0, justificadas = 0;
      histSnap.forEach((d) => {
        const reg = d.data();
        if (!reg || !reg.status) return;
        total++;
        const s = String(reg.status).toLowerCase();
        if (s.includes("presente")) presentes++;
        else if (s.includes("falta")) faltas++;
        else if (s.includes("just")) justificadas++;
      });

      const freq = total > 0 ? ((presentes + justificadas) / total) * 100 : 0;

      box.innerHTML = `
        <div class="aluno">
          <strong>Nome:</strong> ${a.nome || "-"}<br>
          <strong>Matrícula:</strong> ${a.matricula || "-"}<br>
          <strong>CPF:</strong> ${a.cpf || "-"}<br>
          <strong>Email:</strong> ${a.email || "-"}<br>
          <strong>Turma:</strong> ${a.turma || "-"}<br><br>

          ${renderBarraFrequencia(freq)}

          <div style="margin-top:12px; line-height:1.6;">
            <strong>Total:</strong> ${total}<br>
            <strong>Presenças:</strong> ${presentes}<br>
            <strong>Justificadas:</strong> ${justificadas}<br>
            <strong>Faltas:</strong> ${faltas}
          </div>
        </div>
      `;
    };

    window.excluirAluno = async function (alunoId) {
      if (!confirm("Tem certeza que deseja excluir este aluno?")) return;
      await deleteDoc(doc(db, "alunos", alunoId));
      alert("Aluno excluído (online).");
      await carregarAlunos();
      window.mostrarTela("gerenciar");
    };
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Sistema de Frequência</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Poppins:wght@300;400;500&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --verde: #008542;
      --verde-escuro: #006633;
      --vermelho: #C62828;
      --fundo: #f4f6f9;
      --branco: #ffffff;
      --preto: #222;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--fundo);
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      margin-top: 40px;
      color: var(--preto);
      letter-spacing: 2px;
    }

    .top-logo { position: absolute; top: 20px; right: 40px; }
    .top-logo img { height: 60px; }

    .card {
      background: var(--branco);
      width: 90%;
      max-width: 480px;
      padding: 50px 40px;
      border-radius: 20px;
      margin-top: 60px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 30px;
      border: 1px solid #ddd;
      margin: 15px 0;
      font-size: 14px;
      outline: none;
    }

    button {
      margin-top: 20px;
      padding: 12px 40px;
      border: none;
      border-radius: 30px;
      background: var(--verde);
      color: white;
      font-weight: 500;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover { background: var(--verde-escuro); transform: scale(1.05); }

    .btn-vermelho { background: var(--vermelho); }
    .hidden { display: none; }

    .section {
      width: 95%;
      max-width: 900px;
      margin-top: 40px;
      background: var(--branco);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
    }

    .aluno { padding: 15px; border-bottom: 1px solid #eee; }
    h3 { margin-bottom: 20px; }

    @media (max-width: 768px) {
      h1 { font-size: 28px; text-align: center; }
      .card { padding: 30px 20px; }
      .section { padding: 25px; }
      button { width: 100%; }
      .top-logo img { height: 45px; }
    }
  </style>
</head>

<body>

  <div class="top-logo">
    <img src="https://www.ifal.edu.br/sites/default/files/logo-ifal.png" alt="IFAL">
  </div>

  <h1>SISTEMA DE FREQUÊNCIA</h1>

  <!-- LOGIN -->
  <div class="card" id="loginDiv">
    <h3>LOGIN</h3>
    <input type="email" id="usuario" placeholder="Email" autocomplete="username" required>
    <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" required>
    <button onclick="login()">Entrar</button>
    <p id="erro" style="color:red;margin-top:10px;"></p>
  </div>

  <!-- SISTEMA -->
  <div id="mainScreen" style="display:none; width:100%; display:flex; flex-direction:column; align-items:center;">

    <div class="card" id="menuDiv" style="display:none;">
      <h3>Painel Administrativo</h3>

      <button onclick="mostrarTela('chamada')">Fazer Chamada</button>
      <button onclick="mostrarTela('historico')">Consultar Histórico</button>
      <button onclick="mostrarTela('cadastro')">Cadastrar Aluno</button>

      <button onclick="mostrarTela('dados')">Consultar Dados do Aluno</button>
      <button onclick="mostrarTela('gerenciar')">Gerenciar Alunos</button>

      <button class="btn-vermelho" onclick="logout()">Sair</button>
    </div>

    <div class="section hidden" id="area"></div>
  </div>

  <!-- FIREBASE (AUTH + FIRESTORE) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      doc,
      deleteDoc,
      query,
      where,
      orderBy,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    // ✅ SUA CONFIG (mantive a sua)
    const firebaseConfig = {
      apiKey: "AIzaSyBCQ749PmF1P293ohEMsm7B-5UiN17uSRk",
      authDomain: "frequencia-b4d4c.firebaseapp.com",
      projectId: "frequencia-b4d4c",
      storageBucket: "frequencia-b4d4c.firebasestorage.app",
      messagingSenderId: "591825878051",
      appId: "1:591825878051:web:f1536e8ff6a4d34d5e8596",
      measurementId: "G-H7S5DC322Y"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ====== CACHE ======
    let ALUNOS = []; // [{id, nome, matricula, cpf}]

    function hojeISO() {
      return new Date().toISOString().split("T")[0];
    }

    async function carregarAlunos() {
      const snap = await getDocs(collection(db, "alunos"));
      ALUNOS = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (a.nome || "").localeCompare(b.nome || ""));
      return ALUNOS;
    }

    // ====== AUTH ======
    window.login = function () {
      const email = document.getElementById("usuario").value.trim();
      const senha = document.getElementById("senha").value;

      signInWithEmailAndPassword(auth, email, senha)
        .then(() => {
          document.getElementById("erro").innerText = "";
        })
        .catch((error) => {
          document.getElementById("erro").innerText = "Erro: " + error.message;
        });
    };

    window.logout = function () {
      signOut(auth);
    };

    onAuthStateChanged(auth, (user) => {
      const loginDiv = document.getElementById("loginDiv");
      const mainScreen = document.getElementById("mainScreen");
      const menuDiv = document.getElementById("menuDiv");
      const area = document.getElementById("area");

      if (user) {
        loginDiv.style.display = "none";
        mainScreen.style.display = "flex";
        menuDiv.style.display = "block";
        if (area) area.classList.add("hidden");
      } else {
        loginDiv.style.display = "block";
        mainScreen.style.display = "none";
        if (menuDiv) menuDiv.style.display = "none";
      }
    });

    // ====== TELAS ======
    window.mostrarTela = async function (tipo) {
      const area = document.getElementById("area");
      area.innerHTML = "";
      area.classList.remove("hidden");

      if (tipo === "cadastro") {
        area.innerHTML = `
          <h3>Cadastrar Aluno</h3>
          <input id="nome" placeholder="Nome completo">
          <input id="matricula" placeholder="Matrícula">
          <input id="cpf" placeholder="CPF">
          <button onclick="addAluno()">Cadastrar</button>
        `;
        return;
      }

      if (tipo === "chamada") {
        await carregarAlunos();
        area.innerHTML = `
          <h3>Nova Chamada</h3>
          <input type="date" id="dataChamada">
          <div id="lista"></div>
          <button onclick="salvarChamada()">Salvar Chamada</button>
        `;

        document.getElementById("dataChamada").value = hojeISO();
        const lista = document.getElementById("lista");

        if (ALUNOS.length === 0) {
          lista.innerHTML = "<p>Nenhum aluno cadastrado.</p>";
          return;
        }

        ALUNOS.forEach((aluno, i) => {
          lista.innerHTML += `
            <div class="aluno">
              <strong>${aluno.nome}</strong> - ${aluno.matricula}
              <select id="status_${i}">
                <option>Presente</option>
                <option>Falta</option>
                <option>Justificada</option>
              </select>
              <input id="obs_${i}" placeholder="Observação">
            </div>
          `;
        });
        return;
      }

      if (tipo === "historico") {
        await carregarAlunos();
        area.innerHTML = `
          <h3>Consultar Histórico</h3>
          <select id="selectAluno"></select>

          <input type="date" id="dataInicio" placeholder="Data inicial">
          <input type="date" id="dataFim" placeholder="Data final">

          <button onclick="mostrarHistorico()">Consultar</button>
          <div id="resultado"></div>
        `;

        const select = document.getElementById("selectAluno");
        if (ALUNOS.length === 0) {
          document.getElementById("resultado").innerHTML = "<p>Nenhum aluno cadastrado.</p>";
          return;
        }

        ALUNOS.forEach((a, idx) => {
          select.innerHTML += `<option value="${idx}">${a.nome}</option>`;
        });
        return;
      }

      if (tipo === "dados") {
        await carregarAlunos();
        area.innerHTML = `
          <h3>Consultar Dados do Aluno</h3>
          <select id="selectDados"></select>
          <button onclick="mostrarDadosAluno()">Consultar</button>
          <div id="resultadoDados"></div>
        `;

        const select = document.getElementById("selectDados");
        if (ALUNOS.length === 0) {
          document.getElementById("resultadoDados").innerHTML = "<p>Nenhum aluno cadastrado.</p>";
          return;
        }

        ALUNOS.forEach((a, idx) => {
          select.innerHTML += `<option value="${idx}">${a.nome}</option>`;
        });
        return;
      }

      if (tipo === "gerenciar") {
        await carregarAlunos();
        area.innerHTML = `
          <h3>Gerenciar Alunos</h3>
          <div id="listaAlunosGerenciar"></div>
        `;

        const box = document.getElementById("listaAlunosGerenciar");
        if (ALUNOS.length === 0) {
          box.innerHTML = "<p>Nenhum aluno cadastrado.</p>";
          return;
        }

        ALUNOS.forEach((a) => {
          box.innerHTML += `
            <div class="aluno">
              <strong>${a.nome}</strong><br>
              Matrícula: ${a.matricula}<br>
              CPF: ${a.cpf}<br>
              <button class="btn-vermelho" onclick="excluirAluno('${a.id}')">Excluir</button>
            </div>
          `;
        });
        return;
      }

      area.innerHTML = "<p>Tela não encontrada.</p>";
    };

    // ====== AÇÕES FIRESTORE ======
    window.addAluno = async function () {
      const nome = document.getElementById("nome").value.trim();
      const matricula = document.getElementById("matricula").value.trim();
      const cpf = document.getElementById("cpf").value.trim();

      if (!nome || !matricula || !cpf) {
        alert("Preencha Nome, Matrícula e CPF.");
        return;
      }

      await addDoc(collection(db, "alunos"), {
        nome,
        matricula,
        cpf,
        criadoEm: serverTimestamp()
      });

      alert("Aluno cadastrado (online)!");
      await carregarAlunos();
    };

    window.salvarChamada = async function () {
      const data = document.getElementById("dataChamada").value;
      if (!data) { alert("Escolha a data."); return; }

      if (ALUNOS.length === 0) await carregarAlunos();
      if (ALUNOS.length === 0) { alert("Nenhum aluno cadastrado."); return; }

      // Salva um registro no histórico de cada aluno
      for (let i = 0; i < ALUNOS.length; i++) {
        const aluno = ALUNOS[i];
        const status = document.getElementById("status_" + i).value;
        const obs = document.getElementById("obs_" + i).value.trim();

        await addDoc(collection(db, "alunos", aluno.id, "historico"), {
          data,
          status,
          obs,
          criadoEm: serverTimestamp()
        });

        // reset visual após salvar
        document.getElementById("status_" + i).value = "Presente";
        document.getElementById("obs_" + i).value = "";
      }

      alert("Chamada salva (online)!");
    };

    window.mostrarHistorico = async function () {
      const idx = Number(document.getElementById("selectAluno").value);
      const aluno = ALUNOS[idx];
      const inicio = document.getElementById("dataInicio").value;
      const fim = document.getElementById("dataFim").value;
      const resultado = document.getElementById("resultado");

      resultado.innerHTML = `<h3>${aluno.nome}</h3>`;

      const col = collection(db, "alunos", aluno.id, "historico");
      const filtros = [];

      if (inicio) filtros.push(where("data", ">=", inicio));
      if (fim) filtros.push(where("data", "<=", fim));

      // ordena por data desc (data é YYYY-MM-DD, ordena bem)
      const q = query(col, ...filtros, orderBy("data", "desc"));
      const snap = await getDocs(q);

      if (snap.empty) {
        resultado.innerHTML += "<p>Sem registros nesse período.</p>";
        return;
      }

      snap.forEach((d) => {
        const reg = d.data();
        resultado.innerHTML += `
          <div class="aluno">
            <strong>${reg.data}</strong><br>
            Status: ${reg.status}<br>
            Obs: ${reg.obs || "Nenhuma"}
          </div>
        `;
      });
    };

    window.mostrarDadosAluno = function () {
      const idx = Number(document.getElementById("selectDados").value);
      const a = ALUNOS[idx];

      document.getElementById("resultadoDados").innerHTML = `
        <div class="aluno">
          <strong>Nome:</strong> ${a.nome}<br>
          <strong>Matrícula:</strong> ${a.matricula}<br>
          <strong>CPF:</strong> ${a.cpf}
        </div>
      `;
    };

    window.excluirAluno = async function (alunoId) {
      if (!confirm("Tem certeza que deseja excluir este aluno?")) return;

      await deleteDoc(doc(db, "alunos", alunoId));
      alert("Aluno excluído (online).");

      await carregarAlunos();
      // volta/atualiza a tela de gerenciar
      window.mostrarTela("gerenciar");
    };
  </script>

</body>

</html>
